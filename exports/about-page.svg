<svg width="1440" height="3000" viewBox="0 0 1440 3000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'IBM Plex Sans', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="3000" fill="#f8f7f5"/>

  <!-- Navigation -->
  <rect width="1440" height="80" fill="#ffffff" opacity="0.95"/>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="rgba(90, 122, 155, 0.15)" stroke-width="1"/>
  <rect x="100" y="20" width="40" height="40" rx="8" fill="#5a7a9b"/>
  <text x="120" y="46" fill="#ffffff" font-size="18" font-weight="600" text-anchor="middle">IB</text>
  <text x="155" y="38" fill="#2c3e50" font-size="16" font-weight="500">IBISs</text>
  <text x="155" y="55" fill="#6b7280" font-size="11">Islamic Banking Integrity Solutions</text>
  <text x="1100" y="46" fill="#2c3e50" font-size="16" font-weight="400">Home</text>
  <text x="1180" y="46" fill="#5a7a9b" font-size="16" font-weight="500">About</text>
  <text x="1260" y="46" fill="#2c3e50" font-size="16" font-weight="400">Services</text>

  <!-- Hero Banner -->
  <rect y="80" width="1440" height="300" fill="url(#heroGradient)"/>
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(90,122,155,0.1);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(212,197,176,0.2);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(184,197,214,0.1);stop-opacity:1" />
    </linearGradient>
  </defs>
  <text x="720" y="220" fill="#2c3e50" font-size="48" font-weight="600" text-anchor="middle">About IBISs</text>
  <text x="720" y="280" fill="#6b7280" font-size="20" font-weight="400" text-anchor="middle">
    Leading the way in Sharia-compliant training and consultancy for Islamic banking excellence
  </text>

  <!-- Who We Are Section -->
  <rect y="420" width="1440" height="500" fill="#ffffff"/>

  <!-- Icon -->
  <rect x="150" y="480" width="48" height="48" rx="6" stroke="#5a7a9b" stroke-width="2" fill="none"/>
  <rect x="162" y="492" width="24" height="24" stroke="#5a7a9b" stroke-width="2" fill="none"/>

  <text x="210" y="513" fill="#2c3e50" font-size="36" font-weight="600">Who We Are</text>
  <text x="150" y="580" fill="#6b7280" font-size="16">
    <tspan x="150" dy="0">Islamic Banking Integrity Solutions (IBISs) is a Somalia-based Limited Liability</tspan>
    <tspan x="150" dy="28">Company established in 2025. We specialize in providing comprehensive Sharia-</tspan>
    <tspan x="150" dy="28">compliant training and consultancy services tailored to the Islamic banking sector.</tspan>
    <tspan x="150" dy="50">Our focus is on human capital capacity building, ensuring that professionals in</tspan>
    <tspan x="150" dy="28">Islamic financial institutions are equipped with the knowledge, skills, and ethical</tspan>
    <tspan x="150" dy="28">foundation necessary to excel in this rapidly evolving industry.</tspan>
  </text>

  <!-- Image Placeholder -->
  <rect x="780" y="480" width="540" height="350" rx="16" fill="#e8e6e3"/>
  <text x="1050" y="660" fill="#6b7280" font-size="14" text-anchor="middle">Modern Architecture</text>

  <!-- Industry Context Section -->
  <rect y="960" width="1440" height="500" fill="#ffffff"/>

  <!-- Image Placeholder 2 -->
  <rect x="150" y="1020" width="540" height="350" rx="16" fill="#e8e6e3"/>
  <text x="420" y="1200" fill="#6b7280" font-size="14" text-anchor="middle">Abstract Finance</text>

  <!-- Globe Icon -->
  <circle cx="778" cy="1080" r="24" stroke="#5a7a9b" stroke-width="2" fill="none"/>
  <circle cx="778" cy="1080" r="18" stroke="#5a7a9b" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>

  <text x="820" y="1093" fill="#2c3e50" font-size="36" font-weight="600">Industry Context</text>
  <text x="780" y="1160" fill="#6b7280" font-size="16">
    <tspan x="780" dy="0">The Islamic banking sector has experienced remarkable growth</tspan>
    <tspan x="780" dy="28">globally, becoming a significant component of the worldwide financial</tspan>
    <tspan x="780" dy="28">landscape. This expansion brings both tremendous opportunities and</tspan>
    <tspan x="780" dy="28">unique challenges.</tspan>
    <tspan x="780" dy="50">As institutions scale and markets mature, the demand for highly skilled,</tspan>
    <tspan x="780" dy="28">ethically grounded professionals who understand both financial principles</tspan>
    <tspan x="780" dy="28">and Sharia compliance has never been greater. IBISs was founded to</tspan>
    <tspan x="780" dy="28">address this critical human capital gap.</tspan>
  </text>

  <!-- Mission Statement Section -->
  <rect y="1500" width="1440" height="400" fill="url(#missionGradient)"/>
  <defs>
    <linearGradient id="missionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(212,197,176,0.3);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(184,197,214,0.2);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Target Icon -->
  <circle cx="720" cy="1590" r="32" fill="none" stroke="#5a7a9b" stroke-width="2"/>
  <circle cx="720" cy="1590" r="20" fill="none" stroke="#5a7a9b" stroke-width="2"/>
  <circle cx="720" cy="1590" r="6" fill="#5a7a9b"/>

  <text x="720" y="1680" fill="#2c3e50" font-size="36" font-weight="600" text-anchor="middle">Our Mission</text>
  <text x="720" y="1750" fill="#2c3e50" font-size="24" font-weight="400" text-anchor="middle">
    <tspan x="720" dy="0">To promote and offer training and consultancy for human capital</tspan>
    <tspan x="720" dy="40">capacity building in the Islamic banking sector.</tspan>
  </text>

  <!-- Commitment Section -->
  <rect y="1940" width="1440" height="420" fill="#ffffff"/>
  <text x="720" y="2040" fill="#2c3e50" font-size="36" font-weight="600" text-anchor="middle">Our Commitment</text>

  <!-- Card 1: Excellence -->
  <rect x="150" y="2100" width="360" height="200" rx="16" fill="#f8f7f5" stroke="rgba(90, 122, 155, 0.15)" stroke-width="1"/>
  <text x="180" y="2150" fill="#2c3e50" font-size="24" font-weight="600">Excellence</text>
  <text x="180" y="2190" fill="#6b7280" font-size="13">
    <tspan x="180" dy="0">Delivering world-class training</tspan>
    <tspan x="180" dy="22">and consultancy services that</tspan>
    <tspan x="180" dy="22">meet the highest standards of</tspan>
    <tspan x="180" dy="22">quality and relevance.</tspan>
  </text>

  <!-- Card 2: Integrity -->
  <rect x="540" y="2100" width="360" height="200" rx="16" fill="#f8f7f5" stroke="rgba(90, 122, 155, 0.15)" stroke-width="1"/>
  <text x="570" y="2150" fill="#2c3e50" font-size="24" font-weight="600">Integrity</text>
  <text x="570" y="2190" fill="#6b7280" font-size="13">
    <tspan x="570" dy="0">Upholding the principles of</tspan>
    <tspan x="570" dy="22">honesty, transparency, and</tspan>
    <tspan x="570" dy="22">ethical conduct in all our</tspan>
    <tspan x="570" dy="22">interactions and services.</tspan>
  </text>

  <!-- Card 3: Impact -->
  <rect x="930" y="2100" width="360" height="200" rx="16" fill="#f8f7f5" stroke="rgba(90, 122, 155, 0.15)" stroke-width="1"/>
  <text x="960" y="2150" fill="#2c3e50" font-size="24" font-weight="600">Impact</text>
  <text x="960" y="2190" fill="#6b7280" font-size="13">
    <tspan x="960" dy="0">Creating lasting positive change</tspan>
    <tspan x="960" dy="22">in the capabilities and</tspan>
    <tspan x="960" dy="22">competencies of Islamic banking</tspan>
    <tspan x="960" dy="22">professionals.</tspan>
  </text>

  <!-- Footer -->
  <rect y="2400" width="1440" height="600" fill="#2c3e50"/>
  <text x="150" y="2520" fill="#ffffff" font-size="18" font-weight="600">IBISs</text>
  <text x="150" y="2545" fill="#9ca3af" font-size="12">Islamic Banking Integrity Solutions</text>
  <text x="580" y="2520" fill="#ffffff" font-size="16" font-weight="500">Quick Links</text>
  <text x="580" y="2560" fill="#9ca3af" font-size="13">Home</text>
  <text x="580" y="2590" fill="#9ca3af" font-size="13">About</text>
  <text x="900" y="2520" fill="#ffffff" font-size="16" font-weight="500">Contact Information</text>
  <text x="900" y="2560" fill="#9ca3af" font-size="13">📍 Mogadishu, Somalia</text>
  <line x1="150" y1="2680" x2="1290" y2="2680" stroke="#4b5563" stroke-width="1"/>
  <text x="720" y="2740" fill="#9ca3af" font-size="12" text-anchor="middle">© 2026 IBISs. All rights reserved. Sharia-compliant services.</text>
</svg>
