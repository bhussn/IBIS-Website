<svg width="1440" height="3200" viewBox="0 0 1440 3200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'IBM Plex Sans', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="3200" fill="#f8f7f5"/>

  <!-- Navigation -->
  <rect width="1440" height="80" fill="#ffffff" opacity="0.95"/>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="rgba(90, 122, 155, 0.15)" stroke-width="1"/>

  <!-- Logo -->
  <rect x="100" y="20" width="40" height="40" rx="8" fill="#5a7a9b"/>
  <text x="120" y="46" fill="#ffffff" font-size="18" font-weight="600" text-anchor="middle">IB</text>
  <text x="155" y="38" fill="#2c3e50" font-size="16" font-weight="500">IBISs</text>
  <text x="155" y="55" fill="#6b7280" font-size="11">Islamic Banking Integrity Solutions</text>

  <!-- Navigation Links -->
  <text x="1100" y="46" fill="#5a7a9b" font-size="16" font-weight="500">Home</text>
  <text x="1180" y="46" fill="#2c3e50" font-size="16" font-weight="400">About</text>
  <text x="1260" y="46" fill="#2c3e50" font-size="16" font-weight="400">Services</text>

  <!-- Hero Section -->
  <rect y="80" width="1440" height="500" fill="url(#heroGradient)"/>
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(90,122,155,0.1);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgba(212,197,176,0.2);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(184,197,214,0.1);stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Islamic Pattern Overlay -->
  <pattern id="islamicPattern" x="0" y="80" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="none"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#2c3e50" stroke-width="0.5" opacity="0.1"/>
    <path d="M 50 20 L 80 50 L 50 80 L 20 50 Z" fill="none" stroke="#2c3e50" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect y="80" width="1440" height="500" fill="url(#islamicPattern)" opacity="0.3"/>

  <!-- Hero Text -->
  <text x="150" y="260" fill="#2c3e50" font-size="48" font-weight="600">
    <tspan x="150" dy="0">Sharia-Compliant Integrity Solutions</tspan>
    <tspan x="150" dy="60">for Islamic Banking</tspan>
  </text>
  <text x="150" y="400" fill="#6b7280" font-size="20" font-weight="400">Training and Consultancy for Human Capital Development</text>

  <!-- CTA Button -->
  <rect x="150" y="450" width="180" height="55" rx="8" fill="#5a7a9b"/>
  <text x="240" y="483" fill="#ffffff" font-size="16" font-weight="500" text-anchor="middle">Explore Services</text>

  <!-- Mission Section -->
  <rect y="620" width="1440" height="400" fill="#ffffff"/>

  <!-- Mission Image -->
  <rect x="150" y="680" width="550" height="320" rx="16" fill="#e8e6e3"/>
  <text x="425" y="840" fill="#6b7280" font-size="14" text-anchor="middle">Islamic Architecture</text>

  <!-- Mission Text -->
  <text x="780" y="740" fill="#2c3e50" font-size="36" font-weight="600">Our Mission</text>
  <text x="780" y="800" fill="#6b7280" font-size="16" font-weight="400">
    <tspan x="780" dy="0">To promote and offer training and consultancy for human</tspan>
    <tspan x="780" dy="28">capital capacity building in the Islamic banking sector.</tspan>
    <tspan x="780" dy="28">We are committed to advancing knowledge, ensuring</tspan>
    <tspan x="780" dy="28">Sharia compliance, and fostering sustainable development</tspan>
    <tspan x="780" dy="28">across Islamic financial institutions worldwide.</tspan>
  </text>

  <!-- Objectives Section -->
  <rect y="1060" width="1440" height="500" fill="#f8f7f5"/>
  <text x="720" y="1140" fill="#2c3e50" font-size="36" font-weight="600" text-anchor="middle">Our Objectives</text>

  <!-- Objective Card 1 -->
  <rect x="150" y="1200" width="580" height="280" rx="16" fill="#ffffff" stroke="rgba(90, 122, 155, 0.15)" stroke-width="1"/>
  <circle cx="200" cy="1250" r="32" fill="rgba(90, 122, 155, 0.1)"/>
  <path d="M 200 1235 L 200 1265 M 188 1250 L 212 1250" stroke="#5a7a9b" stroke-width="2" fill="none"/>
  <rect x="192" y="1238" width="16" height="20" rx="2" stroke="#5a7a9b" stroke-width="2" fill="none"/>
  <text x="190" y="1320" fill="#2c3e50" font-size="24" font-weight="600">Knowledge-Based Excellence</text>
  <text x="190" y="1360" fill="#6b7280" font-size="14">
    <tspan x="190" dy="0">Deliver knowledge-based consultancy and training</tspan>
    <tspan x="190" dy="24">focused on integrity, equipping professionals with the</tspan>
    <tspan x="190" dy="24">expertise needed to excel in Sharia-compliant banking</tspan>
    <tspan x="190" dy="24">practices.</tspan>
  </text>

  <!-- Objective Card 2 -->
  <rect x="760" y="1200" width="580" height="280" rx="16" fill="#ffffff" stroke="rgba(90, 122, 155, 0.15)" stroke-width="1"/>
  <circle cx="810" cy="1250" r="32" fill="rgba(90, 122, 155, 0.1)"/>
  <circle cx="810" cy="1250" r="12" stroke="#5a7a9b" stroke-width="2" fill="none"/>
  <circle cx="800" cy="1245" r="6" fill="#5a7a9b"/>
  <circle cx="820" cy="1255" r="6" fill="#5a7a9b"/>
  <text x="800" y="1320" fill="#2c3e50" font-size="24" font-weight="600">Sustainable Development</text>
  <text x="800" y="1360" fill="#6b7280" font-size="14">
    <tspan x="800" dy="0">Support sustainable human capital development in</tspan>
    <tspan x="800" dy="24">Islamic financial institutions, building lasting capacity</tspan>
    <tspan x="800" dy="24">for growth and ethical excellence in the sector.</tspan>
  </text>

  <!-- Stats Section -->
  <rect y="1600" width="1440" height="300" fill="#5a7a9b"/>

  <!-- Stat 1 -->
  <text x="360" y="1740" fill="#ffffff" font-size="48" font-weight="600" text-anchor="middle">2025</text>
  <text x="360" y="1780" fill="rgba(255,255,255,0.8)" font-size="16" text-anchor="middle">Established</text>

  <!-- Stat 2 -->
  <text x="720" y="1740" fill="#ffffff" font-size="48" font-weight="600" text-anchor="middle">100%</text>
  <text x="720" y="1780" fill="rgba(255,255,255,0.8)" font-size="16" text-anchor="middle">Sharia Compliant</text>

  <!-- Stat 3 -->
  <text x="1080" y="1740" fill="#ffffff" font-size="48" font-weight="600" text-anchor="middle">Somalia</text>
  <text x="1080" y="1780" fill="rgba(255,255,255,0.8)" font-size="16" text-anchor="middle">Based LLC</text>

  <!-- CTA Section -->
  <rect y="1940" width="1440" height="400" fill="url(#ctaGradient)"/>
  <defs>
    <linearGradient id="ctaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(212,197,176,0.3);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(184,197,214,0.2);stop-opacity:1" />
    </linearGradient>
  </defs>

  <text x="720" y="2100" fill="#2c3e50" font-size="36" font-weight="600" text-anchor="middle">Ready to Transform Your Team?</text>
  <text x="720" y="2160" fill="#6b7280" font-size="20" font-weight="400" text-anchor="middle">
    Partner with us to build exceptional human capital in Islamic banking
  </text>
  <rect x="620" y="2200" width="200" height="55" rx="8" fill="#5a7a9b"/>
  <text x="720" y="2233" fill="#ffffff" font-size="16" font-weight="500" text-anchor="middle">Get in Touch</text>

  <!-- Footer -->
  <rect y="2380" width="1440" height="820" fill="#2c3e50"/>

  <!-- Footer Content -->
  <text x="150" y="2520" fill="#ffffff" font-size="18" font-weight="600">IBISs</text>
  <text x="150" y="2545" fill="#9ca3af" font-size="12">Islamic Banking Integrity Solutions</text>
  <text x="150" y="2590" fill="#9ca3af" font-size="13">
    <tspan x="150" dy="0">Sharia-compliant consulting and training for</tspan>
    <tspan x="150" dy="20">human capital development in the Islamic</tspan>
    <tspan x="150" dy="20">banking sector.</tspan>
  </text>

  <text x="580" y="2520" fill="#ffffff" font-size="16" font-weight="500">Quick Links</text>
  <text x="580" y="2560" fill="#9ca3af" font-size="13">Home</text>
  <text x="580" y="2590" fill="#9ca3af" font-size="13">About</text>
  <text x="580" y="2620" fill="#9ca3af" font-size="13">Services</text>
  <text x="580" y="2650" fill="#9ca3af" font-size="13">Values</text>
  <text x="580" y="2680" fill="#9ca3af" font-size="13">Contact</text>

  <text x="900" y="2520" fill="#ffffff" font-size="16" font-weight="500">Contact Information</text>
  <text x="900" y="2560" fill="#9ca3af" font-size="13">📍 Mogadishu, Somalia</text>
  <text x="900" y="2590" fill="#9ca3af" font-size="13">✉️ info@ibiss.com</text>
  <text x="900" y="2620" fill="#9ca3af" font-size="13">📞 +252 xxx xxx xxx</text>

  <line x1="150" y1="2750" x2="1290" y2="2750" stroke="#4b5563" stroke-width="1"/>
  <text x="720" y="2810" fill="#9ca3af" font-size="12" text-anchor="middle">© 2026 IBISs. All rights reserved. Sharia-compliant services.</text>
</svg>
